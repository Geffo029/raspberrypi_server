<!DOCTYPE html>

<html>


<head>
	<title>Raspberry PI 3</title>
	<script src="tui.js"></script> 
	<link rel="stylesheet" type="text/css" href="style.css" />
	<style>
		.bg { color: grey; }
		.g { color: green; }
		.y { color: yellow; }
		.r { color: red; }
</style>
</head>


<body onload="firstUpdate()">
	<h2>RaspberryPi</h2>

	<pre>
	<div id="info"></div>
	</pre>

	<script>
		const TAB_SIZE = 4
		
		async function firstUpdate() {
			updateInfos()
		}

		/*
		function progressbar(perc, len) {
			const fill_char = '|'
			const empty_char = '-'
			let fill_char_count = len * perc / 100
			//console.log(fill_char_count)
			let bar = fill_char.repeat(fill_char_count).padEnd(len, empty_char)
			return bar
		}
		*/
		
		const info_div = document.getElementById('info')

		const cpuGraph = new Graph([33, 66], 0, 100)
		const tempGraph = new Graph([55, 75], 0, 100)
		const testGraph = new Graphic(0, 100, [33, 66], 80, 40, false)

		async function updateInfos() {
			const resp = await fetch('/infos')
			const infos_json = await resp.json()

			info_div.innerHTML = ""
			
			
			//info_div.innerHTML += progressbar(infos_json.cpu.cores[0].usage[0], 50) + "\n\n"
			info_div.innerHTML += cpuGraph.drawWithNewValue(infos_json.cpu.cores[0].usage[0]) + "\n\n"
			info_div.innerHTML += tempGraph.drawWithNewValue(infos_json.cpu.temp[0]) + "\n\n"
			// testGraph.addValue(infos_json.cpu.cores[0].usage[0])
			testGraph.addValue((1.1+Math.sin((Date.now()/1000)*3.14/16))*40)
			testGraph.updateGraph()
			info_div.innerHTML += testGraph.print()

			info_div.innerHTML += JSON.stringify(infos_json, null, TAB_SIZE)
		}

		setInterval(updateInfos, 500);
	</script>
</body>


</html>
