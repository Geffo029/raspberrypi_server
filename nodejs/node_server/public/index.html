<!DOCTYPE html>

<html>


<head>
	<title>Raspberry PI 3</title>
	<script src="tui.js"></script> 
	<link rel="stylesheet" type="text/css" href="style.css" />
	<style>
		.bg { color: grey; }
		.g { color: green; }
		.y { color: yellow; }
		.r { color: red; }
</style>
</head>


<body onload="firstUpdate()">
	<h2>RaspberryPi</h2>

	<pre>
	<div id="info"></div>
	</pre>

	<script>
		const TAB_SIZE = 4
		
		async function firstUpdate() {
			updateInfos()
		}

		function progressbar(perc, len) {
			const fill_char = '|'
			const empty_char = '-'
			let fill_char_count = len * perc / 100
			//console.log(fill_char_count)
			let bar = fill_char.repeat(fill_char_count).padEnd(len, empty_char)
			return bar
		}
		
		function Graph(thresholds, min, max) {
			// min is currently ignored, supposed 0
			this.thresholds = thresholds
			this.minValue = min
			this.maxValue = max
			this.fill_char = 'o'
			this.empty_char = '.'
			this.values = []
			this.MAX_VALUE_COUNT = 100
			this.width = 30
			this.height = 10
			this.columns = []

			this.drawWithNewValue = (value) => {
				this.values.push(value)
				while (this.values.length > this.MAX_VALUE_COUNT) this.values.shift()
				
				/*let colStr = this.fill_char.repeat(this.height * value / this.maxValue).padEnd(this.height, this.empty_char) 
				const colColor = value > thresholds[1] ? 'r' : value > thresholds[0] ? 'y' : 'g'
				colStr += colColor
				this.columns.push(colStr)
				while (this.columns.length > this.width) this.columns.shift()
				*/
				/*let graph = ""
				for (let r=0; r < this.height; r++) {
					for (let c=0; c < this.width; c++) {
						let char = (this.columns[c]) ? this.columns[c].charAt(this.height-r-1) : this.empty_char
						let color = char == this.empty_char ? 'bg' : this.columns[c].charAt(this.height)
						graph += `<span class='${color}'>${char}</span>`

					}
					graph += "\n"
				}*/
				/**
				 * columns
				 * 	[
				 * 		'ooo.....' 
				 * 		'ooo.....' 
				 * 		'oooo....' 
				 * 		'ooooo.*.'
				 * 	]
				 * 
				 * graph:	
				 * 	....
				 * 	...* 
				 * 	.... 
				 * 	...o 
				 * 	..oo 
				 * 	oooo 
				 * 	oooo 
				 * 	oooo 
				 * 
				 * 	graph[1][3] = this.columns[3].charAt(6), so this.columns[col].charAt(height-row-1)
				 * 
				 * 
				 */
				
				 const computeHeight = (value) => {
					return Math.round((this.height-1) * value / this.maxValue)
				}

				let fillerHeight = computeHeight(value)
				console.log(fillerHeight)
				let thresholdHeights = this.thresholds.map(threshold => computeHeight(threshold))
				let column = []
				for (let r=0; r < this.height; r++) {
					let char = r == fillerHeight ? this.fill_char : this.empty_char
					let color = 
						(r <= fillerHeight && r > thresholdHeights[1]) ? 'r' :
						(r <= fillerHeight && r > thresholdHeights[0]) ? 'y' : 
						(r <= fillerHeight) ? 'g' : 'bg'
					column.push( [char, color] )
				}
				this.columns.push(column)
				while (this.columns.length > this.width) this.columns.shift()

				let graph = ""
				for (let r=0; r < this.height; r++) {
					for (let c=0; c < this.width; c++) {
						if (this.columns[c]) {
							let char = this.columns[c][this.height-1-r][0]
							let color = this.columns[c][this.height-1-r][1]
							graph += `<span class='${color}'>${char}</span>`
						} else {
							graph += `<span class='bg'>${this.empty_char}</span>`
						}
					}
					graph += "\n"
				}
				/** columns
				 * 	[
				 * 		[ [o g], [o g], [o g], [. y], [. y], [. y], [. r], [. r] ],
				 * 		[ [o g], [o g], [o g], [. y], [. y], [. y], [. r], [. r] ],
				 * 		[ [o g], [o g], [o g], [o y], [. y], [. y], [. r], [. r] ],
				 * 		[ [o g], [o g], [o g], [o y], [o y], [. y], [***], [. r] ]
				 * 	]
				 * 
				 * graph:	
				 * 	....
				 * 	...* 
				 * 	.... 
				 * 	...o 
				 * 	..oo 
				 * 	oooo 
				 * 	oooo 
				 * 	oooo 
				 * 
				 * graph[1][3] = columns[3][6], so columns[col][height-1-row]
				 */
			
				return graph
			}
		}
		
		const info_div = document.getElementById('info')

		const cpuGraph = new Graph([33, 66], 0, 100)
		const tempGraph = new Graph([55, 75], 0, 100)

		async function updateInfos() {
			const resp = await fetch('/infos')
			const infos_json = await resp.json()

			info_div.innerHTML = ""
			
			
			info_div.innerHTML += progressbar(infos_json.cpu.cores[0].usage[0], 50) + "\n\n"
			info_div.innerHTML += cpuGraph.drawWithNewValue(infos_json.cpu.cores[0].usage[0]) + "\n\n"
			info_div.innerHTML += tempGraph.drawWithNewValue(infos_json.cpu.temp[0]) + "\n\n"
			
			info_div.innerHTML += JSON.stringify(infos_json, null, TAB_SIZE)
		}

		setInterval(updateInfos, 500);
	</script>
</body>


</html>
